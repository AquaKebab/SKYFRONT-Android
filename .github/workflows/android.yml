
name: SKYFRONT Android Cloud Linux

on:
  workflow_dispatch:
  push:
    branches:
      - main

jobs:
  linux-android:
    runs-on: ubuntu-24.04

    steps:
      - name: Download repository
        uses: actions/checkout@v4

      - name: Install Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Install Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Setup Android SDK
        uses: android-actions/setup-android@v4
        with:
          packages: 'platform-tools'

      - name: Install Android components
        run: |
          sdkmanager "platforms;android-35"
          sdkmanager "build-tools;35.0.0"

      - name: Install Linux dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y git zip unzip build-essential curl

      - name: Download SKYFRONT archive
        run: |
          curl -fL \
            "https://github.com/AquaKebab/SKYFRONT-Android/releases/download/source-v1/SKYFRONT-Android.zip" \
            -o SKYFRONT-Android.zip

          ls -lh SKYFRONT-Android.zip

      - name: Test archive
        run: |
          unzip -t SKYFRONT-Android.zip

      - name: Extract SKYFRONT archive
        run: |
          mkdir -p skyfront
          unzip -o SKYFRONT-Android.zip -d skyfront

      - name: Inspect Android build files
        run: |
          echo "===== REQUIREMENTS.TXT ====="
          cat skyfront/requirements.txt

          echo "===== ALL PYTHON FILES ====="
          find skyfront -type f -name "*.py" | sort

          echo "===== ALL IMPORTS ====="
          grep -R -n -E "^(import |from )" \
            skyfront/main.py skyfront/settings.py skyfront/game \
            --include="*.py" || true

          echo "===== ANDROID CONFIGURATION ====="
          find skyfront -maxdepth 3 -type f \( \
            -name "setup.py" -o \
            -name "setup_android.py" -o \
            -name "pyproject.toml" -o \
            -name "setup.cfg" \
          \) -print

          echo "===== ASSETS ====="
          find skyfront/assets -type f | sort

      - name: Check cloud Linux
        run: |
          echo "===== ENVIRONMENT ====="
          uname -a
          python --version
          java -version
          adb version
          git --version
          echo "===== INSPECTION COMPLETE ====="
