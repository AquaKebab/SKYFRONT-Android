
name: SKYFRONT Android Cloud Linux

on:
  workflow_dispatch:
  push:
    branches:
      - main

jobs:
  linux-android:
    runs-on: ubuntu-24.04

    steps:
      - name: Download repository
        uses: actions/checkout@v4

      - name: Install Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Install Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Setup Android SDK
        uses: android-actions/setup-android@v4
        with:
          packages: 'platform-tools'

      - name: Install Android components
        run: |
          sdkmanager "platforms;android-35"
          sdkmanager "build-tools;35.0.0"

      - name: Install Linux dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y git zip unzip build-essential curl

      - name: Download SKYFRONT archive
        run: |
          curl -fL \
            "https://github.com/AquaKebab/SKYFRONT-Android/releases/download/source-v1/SKYFRONT-Android.zip" \
            -o SKYFRONT-Android.zip

          echo "===== ARCHIVE SIZE ====="
          ls -lh SKYFRONT-Android.zip

      - name: Test archive
        run: |
          unzip -t SKYFRONT-Android.zip

      - name: Extract SKYFRONT archive
        run: |
          mkdir -p skyfront
          unzip -o SKYFRONT-Android.zip -d skyfront

          echo "===== SKYFRONT FILES ====="
          find skyfront -maxdepth 3 -type f | head -150

      - name: Inspect Android build files
        run: |
          echo "===== ROOT FILES ====="
          ls -la skyfront

          echo "===== BUILD CONFIGURATION ====="
          find skyfront -maxdepth 2 -type f \( \
            -name "setup.py" -o \
            -name "requirements.txt" -o \
            -name "setup_android.py" -o \
            -name "pyproject.toml" \
          \) -print

          echo "===== PANDA3D IMPORTS ====="
          grep -R -n "panda3d" skyfront/*.py skyfront/game/*.py || true

      - name: Check cloud Linux
        run: |
          echo "===== SKYFRONT CLOUD LINUX ====="
          uname -a
          python --version
          java -version
          adb version
          git --version
          echo "===== ENVIRONMENT READY ====="
