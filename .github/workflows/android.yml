
name: SKYFRONT Android APK

on:
  workflow_dispatch:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  android:
    runs-on: ubuntu-24.04

    steps:
      - name: Download repository
        uses: actions/checkout@v4

      - name: Install Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Install Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.13'

      - name: Setup Android SDK
        uses: android-actions/setup-android@v4

      - name: Install Android SDK and NDK
        run: |
          yes | sdkmanager --licenses

          sdkmanager \
            "platforms;android-36" \
            "build-tools;36.0.0" \
            "ndk;29.0.14206865"

          SDK_ROOT="${ANDROID_HOME:-$ANDROID_SDK_ROOT}"

          echo "ANDROID_SDK_ROOT=$SDK_ROOT" >> "$GITHUB_ENV"
          echo "ANDROID_NDK_HOME=$SDK_ROOT/ndk/29.0.14206865" >> "$GITHUB_ENV"
          echo "ANDROID_NDK_ROOT=$SDK_ROOT/ndk/29.0.14206865" >> "$GITHUB_ENV"

      - name: Install Linux dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y curl zip unzip

      - name: Download SKYFRONT archive
        run: |
          curl -fL \
            "https://github.com/AquaKebab/SKYFRONT-Android/releases/download/source-v1/SKYFRONT-Android.zip" \
            -o SKYFRONT-Android.zip

          unzip -t SKYFRONT-Android.zip

      - name: Extract SKYFRONT archive
        run: |
          mkdir -p skyfront
          unzip -o SKYFRONT-Android.zip -d skyfront

          test -f skyfront/main.py
          test -f skyfront/settings.py
          test -d skyfront/game
          test -d skyfront/assets

      - name: Install Panda3D and protobuf
        working-directory: skyfront
        run: |
          python -m pip install --upgrade pip setuptools wheel

          python -m pip install \
            --pre \
            --extra-index-url https://archive.panda3d.org/ \
            panda3d

          python -m pip install --upgrade protobuf

          python -c "from panda3d.core import PandaSystem; print(PandaSystem.getVersionString())"
          python -c "import google.protobuf; print('Protobuf OK')"

      - name: Download Android Panda3D wheels
        working-directory: skyfront
        run: |
          mkdir -p android-wheels

          curl -fL \
            "https://rdb.name/panda3d-1.11.0-cp313-cp313-android_arm64.whl" \
            -o android-wheels/panda3d-1.11.0-cp313-cp313-android_arm64.whl

          curl -fL \
            "https://rdb.name/panda3d-1.11.0-cp313-cp313-android_armv7a.whl" \
            -o android-wheels/panda3d-1.11.0-cp313-cp313-android_armv7a.whl

          ls -lh android-wheels

          printf '%s\n' \
            "-f $PWD/android-wheels" \
            "panda3d==1.11.0" \
            > requirements.txt

      - name: Verify Android wheels
        working-directory: skyfront
        run: |
          python -m pip download \
            --no-deps \
            --only-binary=:all: \
            --dest /tmp/wheel-test-arm64 \
            --find-links "$PWD/android-wheels" \
            --platform android_arm64 \
            --python-version 313 \
            --implementation cp \
            --abi cp313 \
            panda3d==1.11.0

          python -m pip download \
            --no-deps \
            --only-binary=:all: \
            --dest /tmp/wheel-test-armv7 \
            --find-links "$PWD/android-wheels" \
            --platform android_armv7a \
            --python-version 313 \
            --implementation cp \
            --abi cp313 \
            panda3d==1.11.0

          echo "Android wheels verified"

      - name: Create Android setup.py
        working-directory: skyfront
        run: |
          cat > setup.py <<'PY'
          from setuptools import setup

          PRC_DATA = """
          notify-level debug
          gl-debug true
          load-display pandagles2
          aux-display pandagles
          """

          setup(
              name="SKYFRONT",
              version="1.0.0",
              options={
                  "build_apps": {
                      "application_id": "com.aquakebab.skyfront",
                      "android_version_code": 2,

                      "platforms": ["android"],

                      "android_abis": [
                          "arm64-v8a",
                          "armeabi-v7a",
                      ],

                      "android_min_sdk_version": 21,
                      "android_target_sdk_version": 36,
                      "android_debuggable": True,

                      "requirements_path": "requirements.txt",

                      "gui_apps": {
                          "SKYFRONT": "main.py",
                      },

                      "log_filename": "$USER_APPDATA/SKYFRONT/skyfront.log",
                      "log_append": False,

                      "use_optimized_wheels": False,

                      "plugins": [
                          "pandagles2",
                          "pandagles",
                          "p3openal_audio",
                      ],

                      "include_patterns": [
                          "SKYFRONT.png",
                          "assets/**/*.png",
                          "assets/**/*.jpg",
                          "assets/**/*.jpeg",
                          "assets/**/*.wav",
                          "assets/**/*.egg",
                          "assets/**/*.bam",
                      ],

                      "extra_prc_data": PRC_DATA,
                  },
              },
              classifiers=[
                  "Topic :: Games/Entertainment",
              ],
          )
          PY

          cat setup.py

      - name: Prepare build
        working-directory: skyfront
        run: |
          rm -rf build dist
          mkdir -p dist

      - name: Build SKYFRONT Android App Bundle
        working-directory: skyfront
        run: |
          python setup.py bdist_apps

          echo "===== BUILD OUTPUT ====="
          find dist -maxdepth 2 -type f -printf '%p %k KB\n'

          AAB="$(find dist -maxdepth 1 -type f -name '*.aab' -print -quit)"

          if [ -z "$AAB" ]; then
            echo "ERROR: AAB was not created"
            exit 1
          fi

          echo "ANDROID_AAB=$AAB" >> "$GITHUB_ENV"

      - name: Convert AAB to APK
        working-directory: skyfront
        run: |
          BUNDLETOOL_VERSION="1.18.3"

          curl -fL \
            "https://github.com/google/bundletool/releases/download/${BUNDLETOOL_VERSION}/bundletool-all-${BUNDLETOOL_VERSION}.jar" \
            -o "$RUNNER_TEMP/bundletool.jar"

          keytool -genkeypair \
            -noprompt \
            -keystore "$RUNNER_TEMP/skyfront-debug.keystore" \
            -storepass android \
            -keypass android \
            -alias androiddebugkey \
            -dname "CN=Android Debug,O=Android,C=US" \
            -keyalg RSA \
            -keysize 2048 \
            -validity 10000

          java -jar "$RUNNER_TEMP/bundletool.jar" build-apks \
            --bundle "$ANDROID_AAB" \
            --output dist/SKYFRONT.apks \
            --mode=universal \
            --ks "$RUNNER_TEMP/skyfront-debug.keystore" \
            --ks-pass pass:android \
            --ks-key-alias androiddebugkey \
            --key-pass pass:android

          unzip -p dist/SKYFRONT.apks universal.apk > dist/SKYFRONT.apk

          echo "===== APK ====="
          ls -lh dist/SKYFRONT.apk
          file dist/SKYFRONT.apk

      - name: Upload SKYFRONT APK
        uses: actions/upload-artifact@v4
        with:
          name: SKYFRONT-Android-Debug
          path: |
            skyfront/dist/SKYFRONT.apk
            skyfront/dist/*.aab
          if-no-files-found: error
          retention-days: 14
